<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">

  <div class="bg-white p-6 rounded-lg shadow-lg max-w-4xl w-full">
    <div class="flex flex-col md:flex-row items-center gap-6">

      <!-- Image -->
      <img
        src="bg.jpg"
        alt="Responsive Example"
        class="w-full md:w-64 rounded-lg shadow"
      >

      <!-- Text, Audio, and Video -->
      <div class="w-full">
        <h2 class="text-2xl font-bold mb-3">Responsive Layout</h2>

        <p class="text-gray-700 mb-4">
          On a laptop, the image and text appear side by side.
          On a mobile screen, they stack vertically. The audio
          player and video player below are also responsive.
        </p>

        <!-- Audio Section -->
        <div class="mb-6">
          <h3 class="font-semibold mb-2">Audio Player</h3>
          <audio controls class="w-full">
            <source src="airtel.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        </div>

        <!-- Video Section -->
        <div>
          <h3 class="font-semibold mb-2">Video Player</h3>
          <video controls class="w-full rounded-lg shadow">
            <source src="sathya.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>

      </div>
    </div>

    <!-- Back Button -->
    <div class="mt-6 text-center">
      <a href="index.html"
         class="inline-block bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        Back to Home
      </a>
    </div>
  </div>

</body>
</html>
