<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-cyan-300">

  <h1 class="text-2xl font-bold mb-4">Responsive Page</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">

    <div class="bg-white p-4 rounded shadow">
      <h2 class="font-semibold mb-2">Responsive Layout</h2>
      <p>
        On a laptop, the text and image appear side by side.
        On a mobile screen, they stack vertically.
      </p>
    </div>

  <!-- Images -->
  <div class="md:w-1/2 grid grid-cols-1 gap-4">
    <img src="BG.jpg" alt="Image 1" class="w-full h-48 object-cover rounded shadow" />
    <img src="ANJAC.jpeg" alt="Image 2" class="w-full h-48 object-cover rounded shadow" />
  </div>
  </div>

  <a href="index.html" class="inline-block mt-6 text-blue-700 underline">
    Back
  </a>

</body>
</html>
