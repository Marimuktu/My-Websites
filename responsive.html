<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-cyan-600">

  <h1 class="text-2xl font-bold mb-4">Responsive Page</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">

    <div class="bg-white p-4 rounded shadow">
      <h2 class="font-semibold mb-2">Responsive Layout</h2>
      <p>
        On a laptop, the text and image appear side by side.
        On a mobile screen, they stack vertically.
      </p>
    </div>

    <img
      src="BG.jpg"
      alt="Responsive demo image"
      class="w-full rounded shadow"
    />

  </div>

  <a href="index.html" class="inline-block mt-6 text-blue-700 underline">
    Back
  </a>

</body>
</html>
